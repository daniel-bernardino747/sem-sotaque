# Development: the app image (the same one production runs) and a Postgres 16.
# The database is used from step 02 on.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://sem_sotaque:sem_sotaque@db:5432/sem_sotaque
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sem_sotaque
      POSTGRES_PASSWORD: sem_sotaque
      POSTGRES_DB: sem_sotaque
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
